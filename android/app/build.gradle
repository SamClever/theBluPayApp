plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.facebook.react'
}

// ─── Variables ────────────────────────────────────────────────────────────────
def enableProguardInReleaseBuilds = false
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"
// ────────────────────────────────────────────────────────────────────────────────

project.ext.react = [
    entryFile: "index.js",
    enableHermes: false  // set to true to enable Hermes
]

react {
    autolinkLibrariesWithApp()
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace 'com.blupay'

    defaultConfig {
        applicationId "com.allpay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Optional: Enable multidex if needed
        // multiDexEnabled true
    }

    ndkVersion rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources.excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Use react-native meta package
    implementation "com.facebook.react:react-native:+"

    if (project.ext.react.get("enableHermes", false)) {
        implementation "com.facebook.react:hermes-android"
    } else {
        implementation jscFlavor
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
}

// Optional: Load custom fonts from vector icons
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
